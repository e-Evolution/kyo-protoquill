name: Scala CI

on:
  pull_request:
  push:
    branches:
      - master
  release:
    types: [ published ] # Triggers the CI when a new GitHub Release is published

# Least-privilege default: both jobs only need to read repository content.
# The `release` job's actual publication credentials are the separate
# SONATYPE_*/PGP_* secrets below, never the GITHUB_TOKEN this block scopes.
permissions:
  contents: read

env:
  # See:
  #  - https://stackoverflow.com/a/73708006
  #  - https://stackoverflow.com/questions/73465937/apache-spark-3-3-0-breaks-on-java-17-with-cannot-access-class-sun-nio-ch-direct
  JAVA_OPTS: -Xms8G -Xmx8G -XX:+UseParallelGC -XX:ReservedCodeCacheSize=256m -XX:+TieredCompilation -Dcommunity=false -Dquill.macro.log=false --add-exports java.base/sun.nio.ch=ALL-UNNAMED
  JDK_JAVA_OPTIONS: -Xms8G -Xmx8G -XX:+UseParallelGC -XX:ReservedCodeCacheSize=256m -XX:+TieredCompilation -Dcommunity=false -Dquill.macro.log=false --add-exports java.base/sun.nio.ch=ALL-UNNAMED

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        scala: [ 3.8.4 ]
        module: [ sqltest, db, bigdata ]

    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup Java and Scala
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '25'
          check-latest: true
      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Scala ${{ matrix.scala }} Building ${{ matrix.module }}
        env:
          SCALA_VERSION: ${{ matrix.scala }}
        run: |
          echo "SCALA_VERSION='$SCALA_VERSION'"
          ./build/build.sh ${{ matrix.module }}

  release:
    # Only a published GitHub Release may reach this job. Both the trigger
    # and job condition require that event so ordinary pushes, pull
    # requests, and other release actions cannot reach `sbt ci-release`.
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}

    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup Java and Scala
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '25'
          check-latest: true
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
